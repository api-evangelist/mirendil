name: Mirendil
description: 'Mirendil is a frontier AI research lab founded by veterans of Anthropic, xAI, Google DeepMind, and OpenAI and led by CEO Behnam Neyshabur and CTO Harsh Mehta. The company is building self-accelerating AI R&D: training frontier models that are exceptional at AI research and then redesigning the entire research loop around them to make it faster, more capable, and more autonomous. Its stated goal is to put frontier AI R&D in everyone''s hands so people closest to a problem can stay on it, with applications spanning drug discovery, chemistry, biology, materials science, and robotics. Mirendil raised a $200M seed round at roughly a $1B valuation co-led by Andreessen Horowitz and Kleiner Perkins with participation from Nvidia. As of mid-2026 the company has no public API, developer portal, SDK, or documentation surface.'
